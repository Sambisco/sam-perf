$(document).ready(function(e) {
	//INSERTION
	$("#insertForm").on('submit', function(e) {
		e.preventDefault();
		$.ajax({
			type: 'POST',
			url: '../controller/absence/insert',
			data: new FormData(this),
			//dataType: 'json',
			contentType: false,
			cache: false,
			processData: false,

			success: function(response) {
				console.log(response)
				if (response === 'true') {
					Swal.fire({
						icon: 'success',
						title: 'Existe',
						text: "L'absence a déja été enregistrer.",
						confirmButtonColor: '#127b8e',
						showConfirmButton: false,
						timer: 2000
					})

				} else {
					Swal.fire({
						icon: 'success',
						title: 'Enregistré',
						text: "Enregistrement effectué avec succés.",
						confirmButtonColor: '#127b8e',
						showConfirmButton: false,
						timer: 2000
					}).then(function() {
						fetchdata();
					});
				}
			}
		});
		$("#ajouter-modal").fadeOut();

	});
	//UPDATE
	$("#updateForm").on('submit', function(e) {
		e.preventDefault();
		$.ajax({
			type: 'POST',
			url: '../controller/demande_absence/save',
			data: new FormData(this),
			dataType: 'json',
			contentType: false,
			cache: false,
			processData: false,

			success: function(response) {
				console.log(response)
			}
		});
		$("#modifier-modal").fadeOut();
		Swal.fire({
			icon: 'success',
			title: 'Modifié',
			text: "Modification effectuée avec succés.",
			confirmButtonColor: '#127b8e',
			showConfirmButton: false,
			timer: 2000
		}).then(function() {
			fetchdata();
		});
	});
	// SUPPRIMER
	$("#deleteForm").on('submit', function(e) {
		e.preventDefault();
		$.ajax({
			type: 'POST',
			url: '../controller/departement/delete',
			data: new FormData(this),
			dataType: 'json',
			contentType: false,
			cache: false,
			processData: false,

			success: function(response) {
				console.log(response)
			}
		});
		$("#supprimer-modal").fadeOut();
		Swal.fire({
			icon: 'error',
			title: 'Supprimé',
			text: "Suppression effectuée avec succés.",
			confirmButtonColor: '#127b8e',
			showConfirmButton: false,
			timer: 2000
		}).then(function() {
			fetchdata();
		});
	});
});

// SHOW UPDATE
$(document).on('click', '#updatebtn', function(e) {
	var id_demande_absence = $(this).data('id');
	$.ajax({
		url: '../controller/demande_absence/fetch_demande_absence',
		type: "post",
		data: {
			id_demande_absence: id_demande_absence
		},
		dataType: 'json',
		success: function(data) {
			console.log(data)
			$("#edit_id").val(data.id_demande_absence);
			$("#up-title-name").html(data.prenom + " " + data.nom);
			$(".title-matricule").html(data.matricule);
			$(".profil_imgPreview").attr("src", data.photo);
			$("#motif").val(data.motif);
			$("#date_du").val(data.periode_du);
			$("#date_au").val(data.periode_au);
			$("#nbr_jour").val(data.nbr_jour);
			$("#avis_rh").val(data.avis_rh).trigger("change");
			$("#precision_superieur").val(data.precision_superieur);
			$("#avis").val(data.avis).trigger("change")
			$("#modifier-modal").fadeIn();
		}

	});


});

		},
	})
	doc.save('Demande absence')
})
$('#Exportindemnite').click(function() {
	let table = $("#example1").clone();
	console.log(table);
	table.find(".no-export").each(function() {
		$(this).remove();
	});

			name: 'Demande absence'
		}
	});
});
