		$(document).on("change", "#photo", function(e) {
    const file = this.files[0];
    if (!file) return;

    // --- Compression + redimensionnement 800px ---
    compressImage(file, 800, 800, 0.9).then(finalBlob => {

        const sizeKB = Math.round(finalBlob.size / 1024);
        console.log("✔ Taille finale : " + sizeKB + " Ko");

        // Remplacer le fichier dans l’input (optionnel)
        const dt = new DataTransfer();
        dt.items.add(new File([finalBlob], "photo_compressed.jpg", { type: "image/jpeg" }));
        document.getElementById("photo").files = dt.files;

        // Aperçu version compressée
        $('#imgPreview').attr('src', URL.createObjectURL(finalBlob));
    });
});

// 🔹 Fonction de compression
// ==========================================================
function compressImage(file, maxWidth = 800, maxHeight = 800, quality = 0.9) {
    return new Promise(function(resolve, reject) {
        const img = new Image();
        const reader = new FileReader();

        reader.onload = function(e) {
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);

        img.onload = function() {
            const canvas = document.createElement("canvas");
            let width = img.width;
            let height = img.height;

            if (width > height) {
                if (width > maxWidth) {
                    height = Math.round(height * maxWidth / width);
                    width = maxWidth;
                }
            } else {
                if (height > maxHeight) {
                    width = Math.round(width * maxHeight / height);
                    height = maxHeight;
                }
            }

            canvas.width = width;
            canvas.height = height;

            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, width, height);

            canvas.toBlob(function(blob) {
                resolve(blob);
            }, "image/jpeg", quality);
        };

        img.onerror = function(err) {
            reject(err);
        };
    });
}
