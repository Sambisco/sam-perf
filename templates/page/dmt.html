$(function() {
	function removeAccents(str) {
  const accentsMap = new Map([
    ['À','A'], ['Á','A'], ['Â','A'], ['Ã','A'], ['Ä','A'], ['Å','A'],
    ['Æ','AE'], ['Ç','C'], ['È','E'], ['É','E'], ['Ê','E'], ['Ë','E'],
    ['Ì','I'], ['Í','I'], ['Î','I'], ['Ï','I'], ['Ð','D'], ['Ñ','N'],
    ['Ò','O'], ['Ó','O'], ['Ô','O'], ['Õ','O'], ['Ö','O'], ['Ø','O'],
    ['Ù','U'], ['Ú','U'], ['Û','U'], ['Ü','U'], ['Ý','Y'], ['Þ','TH'],
    ['ß','ss'], ['à','a'], ['á','a'], ['â','a'], ['ã','a'], ['ä','a'], ['å','a'],
    ['æ','ae'], ['ç','c'], ['è','e'], ['é','e'], ['ê','e'], ['ë','e'],
    ['ì','i'], ['í','i'], ['î','i'], ['ï','i'], ['ð','d'], ['ñ','n'],
    ['ò','o'], ['ó','o'], ['ô','o'], ['õ','o'], ['ö','o'], ['ø','o'],
    ['ù','u'], ['ú','u'], ['û','u'], ['ü','u'], ['ý','y'], ['þ','th'], ['ÿ','y']
  ]);

  return str.split('').map(char => accentsMap.get(char) || char).join('');
}

  const $overlay = $('#shareOverlay');
  const $popup = $('#sharePopup');
  let urlToShare = ""; // sera mis à jour au clic d’un bouton
  const shareText = "Cliquez sur le lien pour télécharger le DMT : \r\n "; // texte partagé

  // --- OUVERTURE / FERMETURE POPUP ---
  function openPopup(link) {
    urlToShare = link; 
    console.log("Lien stocké :", urlToShare);
    $overlay.fadeIn(150);
    $popup.fadeIn(150);
  }

  function closePopup() {
    $popup.fadeOut(150);
    $overlay.fadeOut(150);
  }

  // --- CLIC SUR UN BOUTON DE PARTAGE ---
  $(document).on('click', '.btnShare', function(e) {
    e.preventDefault();
    const id = $(this).data('id');  
    const link = window.location.origin + "/pdf/dmt?pdf=" + id;
    openPopup(link); 
  });

  // --- ACTIONS DE PARTAGE ---

  // Facebook
  $('#fbShare').on('click', function() {
    const fbUrl = 'https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(urlToShare);
    window.open(fbUrl, 'fbShareWindow', 'width=600,height=400');
    closePopup();
  });

  // Twitter
  $('#twShare').on('click', function() {
    const twUrl = 'https://twitter.com/intent/tweet?url=' 
                  + encodeURIComponent(urlToShare) 
                  + '&text=' + encodeURIComponent(shareText);
    window.open(twUrl, 'twShareWindow', 'width=600,height=400');
    closePopup();
  });

  // WhatsApp
  $('#waShare').on('click', function() {
    const waUrl = 'https://api.whatsapp.com/send?text=' 
                  + encodeURIComponent(shareText + " " + urlToShare);
    window.open(waUrl, 'waShareWindow', 'width=600,height=600');
    closePopup();
  });

  // Email
$('#emailShare').on('click', function() {
  const destinataire = "destinataire@example.com"; // <-- obligatoire
  const subject = encodeURIComponent(removeAccents("DMT"));
  const body = encodeURIComponent(
    removeAccents(shareText + urlToShare)
  );

  window.location.href = `mailto:${destinataire}?subject=${subject}&body=${body}`;
  closePopup();
});


  // Copier le lien
  async function copyLink() {
    const $msg = $("#shareMessage");
    try {
      await navigator.clipboard.writeText(urlToShare);
      $msg.text("Lien copié dans le presse-papier ✅").fadeIn();
      setTimeout(() => { $msg.fadeOut(); closePopup(); }, 2000);
    } catch {
      $msg.text("Erreur lors de la copie ❌").fadeIn();
      setTimeout(() => { $msg.fadeOut(); closePopup(); }, 2000);
    }
  }

  $('#copyLinkBtn').on('click', copyLink);

  // --- ACCESSIBILITÉ CLAVIER ---
  $('.share-btn').on('keydown', function(e) {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      $(this).click();
    }
  });

  // --- FERMETURE POPUP ---
  $overlay.on('click', closePopup);
  $popup.find('.close-btn').on('click', closePopup);
});
</script>
