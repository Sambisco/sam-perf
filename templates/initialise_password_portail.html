<!DOCTYPE html>
<html lang="fr">

	<head>
		<meta charset="UTF-8">
		<meta http-equiv="X-UA-Compatible" content="IE=edge">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Sam perf</title>
		<link href="{{ url_for('static', filename='img/logo/Diapositive1.png') }}"
			rel="icon">
		<link rel="stylesheet"
			href="{{ url_for('static', filename='css/fontawesome-free/css/all.min.css') }}">
		<link rel="stylesheet"
			href="{{ url_for('static', filename='css/css/style-form.css') }}">
		<script
			src="{{ url_for('static', filename='script/jquery/jquery.min.js') }}"></script>
		<script src="{{ url_for('static', filename='script/script/script.js') }}"
			defer></script>
	</head>

	<body>
		<div class="icons-switcher" style="display: none;">
			<i class="fas fa-palette"></i>
		</div>
		<div class="color-box">
			<div class="color-switchers">
				<button class="btn-switcher principal active-color" id="principal"
					data-color="#005f9e"></button>
				<button class="btn-switcher green-switcher" id="green-switcher"
					data-color="#04640e"></button>
				<button class="btn-switcher orange-switcher" id="orange-switcher"
					data-color="#955d02"></button>
				<button class="btn-switcher purple-switcher" id="purple-switcher"
					data-color="#8e44ad"></button>
			</div>
		</div>
		<div class="content-body">
			<div class="overlay"></div>
			<div class="container3D">
				<div class="clipath">
                    <i class="fa fa-chalkboard-teacher"></i>
                    <h1>Bienvenue à</h1>
                    <h2>Sam-perf</h2>
                </div>
				<div class="parent">
					<div class="card">
						<div class="content-date-box">
                            <div class="date-box">
                                <span class="month"></span>
                                <span class="date"><i
                                        class="fa fa-lock"></i></span>
                            </div>
                        </div>
						<div class="content-box">
							<h1 class="card-title">REINITIALISER !</h1>
							<div class="container-form">
								<form action="{{ url_for('update_password_portail_route') }}"
									method="post">
									<div class="user-details-login">
										<div class="input-group">
											<label class="label-details">Email</label>
											<div class="input-box">
												<span class="span-left"><i class="fa fa-envelope fa-icon"></i>
												</span>
												<input type="text" class="text-input" name="emailconnect" id
													required="required"
													placeholder="Email ou Telephone" value="{{ email }}" readonly>
											</div>
										</div>
										<div class="input-group">
											<label class="label-details">Nouveau mot de passe</label>
											<div class="input-box">
												<span class="span-left"><i class="fa fa-lock fa-icon"></i></span>
												<input type="password" class="text-input" name="mdpconnect"
													id="password" required="required"
													placeholder="Nouveau mot de passe">
												<span class="span-right" id="togglePassword"><i
														class="fa fa-eye-slash"
														id="show-eye"></i></span>
											</div>
										</div>
									</div>
									<div class="full-button-login">
										<input type="submit" class="btn-full" name="submit"
											value="Mettre a jour">
									</div>
									{% with messages = get_flashed_messages(with_categories=true) %}
									{% if messages %}
									{% for category, message in messages %}
									<div class="alert-info-succes alert-info hide alert-{{ category }}">
										<span class="alert-info-succes-msg">
											<span class="fas fa-exclamation-circle"></span>
											<span class="msg-succes">{{ message_sucess | safe }}</span>
										</span>
										<div class="close-alert-info-succes close-alert-info">
											<span class="fas fa-times"></span>
										</div>
									</div>
									{% endfor %}
									{% endif %}
									{% endwith %}
									<hr class="separator">

								</form>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
		<script language="JavaScript">
        $(document).on("click", "#togglePassword", function(e) {
            // toggle the type attribute
            var password = $('#password');
            if (password.attr("type") === "password") {
                password.attr("type", "text");
            } else {
                password.attr("type", "password");
            }
            $("#show-eye").toggleClass('fa-eye');
            $("#show-eye").toggleClass('fa-eye-slash');
            // toggle the eye icon

        });
    </script>
	</body>

</html>
