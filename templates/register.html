<!DOCTYPE html>
<html lang="fr">

    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Inscription</title>
        <link
            href="{{ url_for('static', filename='img/logo/diapositive.png') }}"
            rel="icon">
        <link rel="stylesheet"
            href="{{ url_for('static', filename='css/fontawesome-free/css/all.min.css') }}">
        <link rel="stylesheet"
            href="{{ url_for('static', filename='css/css/style-form.css') }}">
        <script
            src="{{ url_for('static', filename='script/jquery/jquery.min.js') }}"></script>
        <script
            src="{{ url_for('static', filename='script/script/script.js') }}"
            defer></script>

    </head>

    <body>
        <div class="color-box" style="display: none;">
            <div class="icons-switcher">
                <i class="fas fa-palette"></i>
            </div>
            <div class="color-switchers">
                <button class="btn-switcher principal active-color"
                    id="principal" data-color="bleu"></button>
                <button class="btn-switcher green-switcher" id="green-switcher"
                    data-color="vert"></button>
                <button class="btn-switcher purple-switcher"
                    id="purple-switcher" data-color="violet"></button>
                <button class="btn-switcher red-switcher" id="red-switcher"
                    data-color="#93080d"></button>

            </div>
        </div>
        <div class="content-body">
            <div class="overlay"></div>

            <div class="container3D">
                <div class="clipath">
                    <i class="fa fa-chalkboard-teacher"></i>
                    <h1>Bienvenue à</h1>
                    <h2>Sam-perf</h2>
                </div>
                <div class="parent">
                    <div class="card card-register">
                        <div class="content-date-box">
                            <div class="date-box">
                                <span class="month"></span>
                                <span class="date"><i
                                        class="fa fa-key"></i></span>
                            </div>
                        </div>
                        <div class="content-box">
                            <h1 class="card-title">S'inscrire</h1>
                            <div class="container-form">
                                <form action="controller/register"
                                    method="post">
                                    <div class="user-details-register">
                                        <div class="input-group">
                                            <label class="label-details">Nom
                                                complet</label>
                                            <div class="input-box">
                                                <span class="span-left"><i
                                                        class="fa fa-user fa-icon"></i></span>
                                                <input type="text"
                                                    class="text-input"
                                                    name="nom" id
                                                    placeholder="Entrer nom complet"
                                                    required="required">
                                            </div>
                                        </div>
                                        <div class="input-group">
                                            <label
                                                class="label-details">Entreprise</label>
                                            <div class="input-box">
                                                <span class="span-left"><i
                                                        class="fa fa-user fa-icon"></i></span>
                                                <input type="text"
                                                    class="text-input"
                                                    name="nom_entreprise" id
                                                    placeholder="Entrer nom complet"
                                                    required="required">
                                            </div>
                                        </div>
                                        <div class="input-group">
                                            <label
                                                class="label-details">Telephone</label>
                                            <div class="input-box">
                                                <span class="span-left"><i
                                                        class="fa fa-phone fa-icon"></i>
                                                </span>
                                                <input type="text"
                                                    class="text-input"
                                                    name="telephone" id
                                                    placeholder="Entrer telephone"
                                                    required="required">
                                            </div>
                                        </div>

                                        <div class="input-group">
                                            <label
                                                class="label-details">Email</label>
                                            <div class="input-box">
                                                <span class="span-left"><i
                                                        class="fa fa-envelope fa-icon"></i>
                                                </span>
                                                <input type="text"
                                                    class="text-input"
                                                    name="emailconnect" id
                                                    placeholder="Entrer email"
                                                    required="required">
                                            </div>
                                        </div>
                                        <div class="input-group">
                                            <label
                                                class="label-details">Formule</label>
                                            <div class="input-box">
                                                <span class="span-left"><i
                                                        class="fa fa-home fa-icon"></i></span>
                                                <select name="formule"
                                                    class="text-input"
                                                    required="required">
                                                    <option value>Selectionnez
                                                        formule</option>
                                                    <option value="1">Formule
                                                        1</option>
                                                    <option value="3">Formule
                                                        2</option>
                                                    <option value="1000">Formule
                                                        3</option>
                                                </select>
                                            </div>
                                        </div>
                                        <div class="input-group">
                                            <label class="label-details">Mot de
                                                passe</label>
                                            <div class="input-box">
                                                <span class="span-left"><i
                                                        class="fa fa-lock fa-icon"></i></span>
                                                <input type="password"
                                                    class="text-input"
                                                    name="mdpconnect"
                                                    id="password"
                                                    placeholder="Entrer mot de passe"
                                                    required="required">
                                                <span class="span-right"
                                                    id="togglePassword"><i
                                                        class="fa fa-eye-slash"
                                                        id="show-eye"></i></span>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="full-button">
                                        <input type="submit" class="btn-full"
                                            name="register" value="Inscription">
                                    </div>
                                    <hr class="separator">
                                    <div class="foot">
                                        <span><a
                                                href="{{ url_for('index') }}">Se
                                                connecter</a></span>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <script language="JavaScript">
    $(document).on("click", "#togglePassword", function (e) {
        // toggle the type attribute
        var password = $('#password');
        if (password.attr("type") === "password") {
            password.attr("type", "text");
        } else {
            password.attr("type", "password");
        }
        $("#show-eye").toggleClass('fa-eye');
        $("#show-eye").toggleClass('fa-eye-slash');
        // toggle the eye icon
    });
    $(document).on("click", "#togglePassword-conf", function (e) {
        // toggle the type attribute
        var password = $('#password-conf');
        if (password.attr("type") === "password") {
            password.attr("type", "text");
        } else {
            password.attr("type", "password");
        }
        $("#show-eye-conf").toggleClass('fa-eye');
        $("#show-eye-conf").toggleClass('fa-eye-slash');
        // toggle the eye icon
    });
</script>
    </body>

</html>
